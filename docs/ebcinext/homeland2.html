<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homeland 2 | EBCI Next</title>
    <meta name="description" content="Homeland 2 Video Presentation - EBCI Next">
    <link rel="icon" type="image/png" href="/wp-content/uploads/2020/10/cropped-logo-32x32.png">
    
    <meta property="og:title" content="Homeland 2 | EBCI Next">
    <meta property="og:description" content="ชมวิดีโอ Homeland 2">
    <meta property="og:type" content="video.other">
    <meta property="og:url" content="https://ebcinext.com/homeland2/">
    <meta property="og:image" content="https://i.ytimg.com/vi/cX83uVBsH3w/maxresdefault.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
        }

        .cinema-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f111a 0%, #050508 100%);
        }

        .ambient-glow {
            position: absolute;
            width: 80%;
            height: 60%;
            background: radial-gradient(circle, rgba(56, 103, 214, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 1;
        }

        .video-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating Top Bar */
        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.88) 0%, rgba(5, 5, 8, 0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .cinema-container:hover .header-bar,
        .header-bar:hover,
        .header-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-decoration: none;
        }

        .brand-pill {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #60a5fa;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Unmute Prompt Button */
        .unmute-btn {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.4);
            animation: pulseGlow 2s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        .unmute-btn:hover {
            background: rgba(30, 58, 138, 0.9);
            border-color: rgba(96, 165, 250, 0.6);
            transform: translateX(-50%) scale(1.05);
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.3);
            }
            50% {
                box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(96, 165, 250, 0.7);
            }
        }

        @media (max-width: 768px) {
            .header-bar {
                opacity: 0.9;
                padding: 12px 16px;
            }
            .unmute-btn {
                bottom: 20px;
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="cinema-container" id="cinema">
        <div class="ambient-glow"></div>

        <div class="header-bar visible" id="headerBar">
            <a href="https://ebcinext.com" class="brand-badge" target="_blank">
                <span>EBCI NEXT</span>
                <span class="brand-pill">HOMELAND 2</span>
            </a>
            <div>
                <a href="https://youtu.be/cX83uVBsH3w" target="_blank" class="action-btn" title="เปิดบน YouTube">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <span>YouTube</span>
                </a>
            </div>
        </div>

        <div class="video-wrapper">
            <div class="video-frame">
                <div id="player"></div>
            </div>
        </div>

        <!-- Unmute prompt button -->
        <button id="unmuteBtn" class="unmute-btn" onclick="unmuteVideo()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <span>แตะเพื่อเปิดเสียง (Tap for Sound)</span>
        </button>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isMuted = true;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'cX83uVBsH3w',
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    playsinline: 1,
                    controls: 1,
                    rel: 0,
                    modestbranding: 1,
                    loop: 1,
                    playlist: 'cX83uVBsH3w',
                    origin: window.location.origin
                },
                events: {
                    onReady: function(event) {
                        // Force autoplay muted to satisfy all modern browser policies
                        event.target.mute();
                        event.target.playVideo();
                    },
                    onStateChange: function(event) {
                        // If video ends, replay
                        if (event.data === YT.PlayerState.ENDED) {
                            event.target.playVideo();
                        }
                    }
                }
            });
        }

        function unmuteVideo() {
            if (player && typeof player.unMute === 'function') {
                player.unMute();
                player.setVolume(100);
                isMuted = false;
                const btn = document.getElementById('unmuteBtn');
                if (btn) btn.style.display = 'none';
            }
        }

        // Auto-hide header bar after 3.5 seconds
        let timeout;
        const header = document.getElementById('headerBar');
        function showHeader() {
            header.classList.add('visible');
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                header.classList.remove('visible');
            }, 3000);
        }
        window.addEventListener('mousemove', showHeader);
        window.addEventListener('touchstart', showHeader);
        timeout = setTimeout(() => {
            header.classList.remove('visible');
        }, 3500);

        // Fallback: If user clicks or taps anywhere on screen, unmute audio
        document.body.addEventListener('click', function(e) {
            if (isMuted && !e.target.closest('a') && !e.target.closest('button')) {
                unmuteVideo();
            }
        }, { once: true });
    </script>
</body>
</html>
